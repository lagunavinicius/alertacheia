# Pipeline CI/CD do AlertaCheia: um commit dispara build, testes e deploy
# sem passo manual.
#
#   qualidade ─┐
#   seguranca ─┤
#   testes ────┼─> docker (build -> smoke test -> Trivy) ─> deploy (GHCR, só na main)
#   frontend ──┘
#
# Os quatro primeiros jobs rodam em paralelo. A imagem só é construída se o
# código passar em todos eles, e só é publicada se o smoke test e o Trivy passarem.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGEM_LOCAL: alertacheia:${{ github.sha }}

jobs:
  qualidade:
    name: Qualidade de código (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install ruff
      - run: ruff check . --output-format github

  seguranca:
    name: Segurança (Bandit SAST + pip-audit SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install "bandit[toml]" pip-audit
      - name: Bandit (análise estática do código)
        run: bandit -r alertacheia api dados ia iot -c pyproject.toml -f txt
      - name: pip-audit (vulnerabilidades conhecidas nas dependências)
        run: pip-audit -r requirements.txt --strict

  testes:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: pytest + cobertura
        run: pytest -v --junitxml=relatorio-testes.xml --cov=alertacheia --cov=api --cov=dados --cov=ia --cov-report=term --cov-report=xml
      - name: Resumo no GitHub
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("relatorio-testes.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          print("### Testes do AlertaCheia")
          print(f"- casos: {s.get('tests')} · falhas: {s.get('failures')} · erros: {s.get('errors')} · tempo: {float(s.get('time')):.1f}s")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: |
            relatorio-testes.xml
            coverage.xml

  frontend:
    name: Build do frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Imagem Docker (build, smoke test, Trivy)
    needs: [qualidade, seguranca, testes, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGEM_LOCAL" .
      - name: Smoke test (sobe o container e exercita o fluxo)
        run: |
          docker run -d --name ac -p 8080:8080 "$IMAGEM_LOCAL"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/saude && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/saude | grep -q '"modelo_carregado":true'
          curl -fsS http://localhost:8080/api/estacoes | grep -q 'EST-03'
          # sem chave de sensor a API deve recusar a leitura
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/leituras \
                 -H 'Content-Type: application/json' \
                 -d '{"estacao_id":"EST-01","ts":"2030-01-01T00:00","nivel_cm":100,"chuva_mm":0,"umidade_solo_pct":40}')" = "401"
          curl -fsS http://localhost:8080/ | grep -q 'AlertaCheia'
          docker inspect --format '{{.State.Health.Status}}' ac
      - name: Logs do container
        if: always()
        run: docker logs ac || true
      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGEM_LOCAL }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Salvar imagem para o deploy
        run: docker save "$IMAGEM_LOCAL" | gzip > imagem.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: imagem, path: imagem.tar.gz, retention-days: 1 }

  deploy:
    name: Deploy (publica a imagem no GitHub Container Registry)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: imagem }
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publicar
        run: |
          gunzip -c imagem.tar.gz | docker load
          DESTINO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag "$IMAGEM_LOCAL" "$DESTINO:${{ github.sha }}"
          docker tag "$IMAGEM_LOCAL" "$DESTINO:latest"
          docker push "$DESTINO:${{ github.sha }}"
          docker push "$DESTINO:latest"
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem publicada: \`$DESTINO:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
