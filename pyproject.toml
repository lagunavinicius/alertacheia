[project]
name = "alertacheia"
version = "1.0.0"
description = "Alerta comunitário de enchentes — Global Solution 2026/2 (FIAP)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", "frontend", "datalake", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert é usado nos testes
    "B008",  # Depends() em parâmetro padrão é o padrão do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # senhas de teste fixas
"scripts/*" = ["E501"]        # HTML/CSS do PDF em linhas longas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "frontend", "datalake"]
skips = ["B101"]
